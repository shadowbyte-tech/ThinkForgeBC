<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — ResourceX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--rx-graphite-900); color:var(--rx-ivory-100); font-family:'Space Grotesk',sans-serif; text-align:center; padding:2rem; }
    .err-code { font-size:6rem; font-weight:700; color:var(--rx-brass-400); margin:0; line-height:1; }
    .err-msg { font-size:1.25rem; color:var(--rx-ivory-300); margin:1rem 0 2rem; }
    .err-link { display:inline-block; padding:0.75rem 1.5rem; background:var(--rx-brass-500); color:var(--rx-graphite-900); border-radius:8px; text-decoration:none; font-weight:600; font-size:0.9rem; transition:background 0.2s; }
    .err-link:hover { background:var(--rx-brass-400); }
  </style>
</head>
<body>
  <div>
    <p class="err-code">404</p>
    <p class="err-msg">The page you're looking for doesn't exist or has been moved.</p>
    <a href="index.html" class="err-link">Back to Home</a>
  </div>
</body>
</html>
