<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Marketplace | ResourceX</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Shared CSS -->
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/compat.css">
    
    <style>
        /* Page Specific Styles */
        :root {
            --rx-nav-height: 72px;
        }
        
        body {
            background-color: var(--rx-graphite, #151817);
            color: var(--rx-ivory, #F2EFE7);
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        /* Typography overrides */
        h1, h2, h3, h4, h5, h6 { font-family: 'Space Grotesk', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .marketplace-header {
            padding: 2rem 5%;
            border-bottom: 1px solid rgba(242, 239, 231, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .breadcrumb {
            font-size: 0.875rem;
            color: var(--rx-stone, #8D8A82);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .page-title {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 600;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .sort-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sort-control select {
            background-color: transparent;
            border: 1px solid var(--rx-stone, #8D8A82);
            color: var(--rx-ivory, #F2EFE7);
            padding: 0.5rem;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            outline: none;
        }
        
        .sort-control select option {
            background-color: var(--rx-graphite, #151817);
            color: var(--rx-ivory, #F2EFE7);
        }

        .item-count {
            color: var(--rx-stone, #8D8A82);
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .rx-badge-demo {
            background-color: var(--rx-brass, #A88A52);
            color: var(--rx-graphite, #151817);
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .marketplace-container {
            display: flex;
            padding: 2rem 5%;
            gap: 2rem;
            align-items: flex-start;
        }

        /* Sidebar Filters */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            position: sticky;
            top: calc(var(--rx-nav-height) + 2rem);
            max-height: calc(100vh - var(--rx-nav-height) - 4rem);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--rx-stone) transparent;
        }
        
        /* Hidden checkbox for mobile filter toggle */
        #filter-toggle {
            display: none;
        }
        
        .filter-toggle-btn {
            display: none;
            background: var(--rx-forest-green, #173A2B);
            color: var(--rx-ivory);
            border: 1px solid var(--rx-brass, #A88A52);
            padding: 0.75rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 1rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            text-align: center;
            box-sizing: border-box;
        }

        .filter-section {
            border-bottom: 1px solid rgba(242, 239, 231, 0.1);
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .filter-section:last-child {
            border-bottom: none;
        }

        .filter-title {
            font-size: 1rem;
            margin: 0 0 1rem 0;
            color: var(--rx-brass, #A88A52);
        }

        .rx-search-wrap {
            position: relative;
        }

        .rx-search-wrap input {
            width: 100%;
            background: rgba(242, 239, 231, 0.05);
            border: 1px solid rgba(242, 239, 231, 0.2);
            color: var(--rx-ivory, #F2EFE7);
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }
        
        .rx-search-wrap svg {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            width: 1rem;
            height: 1rem;
            fill: var(--rx-stone, #8D8A82);
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
        }

        .filter-option input[type="checkbox"] {
            accent-color: var(--rx-brass, #A88A52);
            width: 16px;
            height: 16px;
        }

        .filter-input-text, .filter-input-number {
            width: 100%;
            background: rgba(242, 239, 231, 0.05);
            border: 1px solid rgba(242, 239, 231, 0.2);
            color: var(--rx-ivory, #F2EFE7);
            padding: 0.5rem;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            margin-bottom: 0.5rem;
        }

        .qty-range {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-clear-filters {
            background: transparent;
            color: var(--rx-brass, #A88A52);
            border: 1px solid var(--rx-brass, #A88A52);
            padding: 0.75rem;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .btn-clear-filters:hover {
            background: var(--rx-brass, #A88A52);
            color: var(--rx-graphite, #151817);
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            min-width: 0;
        }

        .category-pills {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
            scrollbar-width: none;
        }
        
        .category-pills::-webkit-scrollbar {
            display: none;
        }

        .category-pill {
            background: rgba(242, 239, 231, 0.05);
            border: 1px solid rgba(242, 239, 231, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .category-pill:hover {
            border-color: rgba(242, 239, 231, 0.4);
        }

        .category-pill.active {
            background: rgba(168, 138, 82, 0.2);
            border-color: var(--rx-brass, #A88A52);
            color: var(--rx-brass, #A88A52);
        }

        .active-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .filter-tag {
            background: var(--rx-forest-green, #173A2B);
            border: 1px solid var(--rx-brass, #A88A52);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--rx-ivory);
        }

        .filter-tag span {
            cursor: pointer;
            font-weight: bold;
            color: var(--rx-brass, #A88A52);
        }
        
        .filter-tag span:hover {
            color: var(--rx-ivory, #F2EFE7);
        }

        /* Grid */
        .materials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .rx-material-card {
            background: rgba(242, 239, 231, 0.03);
            border: 1px solid rgba(242, 239, 231, 0.1);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }
        
        .rx-material-card:hover {
            transform: translateY(-4px);
            border-color: rgba(242, 239, 231, 0.3);
        }

        .card-visual {
            height: 120px;
            background: rgba(242, 239, 231, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid rgba(242, 239, 231, 0.1);
        }
        
        .card-visual.rx-cat-metals { background: linear-gradient(135deg, rgba(168, 138, 82, 0.2), rgba(242, 239, 231, 0.05)); }
        .card-visual.rx-cat-polymers { background: linear-gradient(135deg, rgba(23, 58, 43, 0.4), rgba(242, 239, 231, 0.05)); }
        .card-visual.rx-cat-fibers { background: linear-gradient(135deg, rgba(141, 138, 130, 0.3), rgba(242, 239, 231, 0.05)); }
        
        .card-visual span {
            font-size: 1.5rem;
            color: rgba(242, 239, 231, 0.3);
            font-weight: bold;
        }
        
        .card-badges {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            align-items: flex-end;
        }

        .card-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-category {
            color: var(--rx-brass, #A88A52);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .card-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            margin: 0 0 1rem 0;
            line-height: 1.3;
        }

        .card-specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            color: var(--rx-stone, #8D8A82);
        }
        
        .card-specs div strong {
            display: block;
            color: var(--rx-ivory, #F2EFE7);
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .card-footer {
            margin-top: auto;
            border-top: 1px solid rgba(242, 239, 231, 0.1);
            padding-top: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-price {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            font-size: 1.125rem;
        }

        .btn-view {
            background: var(--rx-ivory, #F2EFE7);
            color: var(--rx-graphite, #151817);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.875rem;
            transition: opacity 0.2s;
        }
        
        .btn-view:hover {
            opacity: 0.9;
        }

        .card-actions-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-compare {
            background: rgba(85, 126, 232, 0.15);
            color: var(--rx-blue-400, #557ee8);
            border: 1px solid rgba(85, 126, 232, 0.3);
            padding: 0.45rem 0.65rem;
            border-radius: 4px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            text-decoration: none;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-compare:hover {
            background: rgba(85, 126, 232, 0.25);
            color: #ffffff;
            border-color: var(--rx-blue-500, #557ee8);
        }

        .btn-shortlist {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(223, 223, 222, 0.15);
            color: var(--rx-stone-400, #8D8A82);
            padding: 0.45rem 0.65rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-shortlist:hover, .btn-shortlist.active {
            color: #cca56f;
            border-color: #cca56f;
            background: rgba(204, 165, 111, 0.15);
        }

        .card-apps-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin: 0.75rem 0;
        }

        .card-app-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(223, 223, 222, 0.1);
            border-radius: 3px;
            padding: 0.15rem 0.45rem;
            font-size: 0.7rem;
            color: #bbbbbb;
            font-family: 'Inter', sans-serif;
        }

        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            background: rgba(242, 239, 231, 0.02);
            border: 1px dashed rgba(242, 239, 231, 0.2);
            border-radius: 8px;
        }
        
        .no-results h3 {
            margin-bottom: 1rem;
            color: var(--rx-brass, #A88A52);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .marketplace-container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                position: static;
                max-height: none;
                display: none;
            }
            
            #filter-toggle:checked ~ .sidebar {
                display: block;
            }
            
            .filter-toggle-btn {
                display: block;
            }
            
            .materials-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }
        
        @media (max-width: 600px) {
            .materials-grid {
                grid-template-columns: 1fr;
            }
            .header-controls {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

    <div id="rx-nav-container"></div>

    <main style="padding-top: var(--rx-nav-height)">
        <header class="marketplace-header">
            <div>
                <div class="breadcrumb">
                    ResourceX <span>/</span> Marketplace
                </div>
                <h1 class="page-title">Material Marketplace</h1>
            </div>
            <div class="header-controls">
                <div class="sort-control">
                    <label for="sort-select">Sort by:</label>
                    <select id="sort-select">
                        <option value="relevance">Relevance</option>
                        <option value="distance">Distance</option>
                        <option value="net-value">Net Value</option>
                        <option value="price-asc">Price (Low to High)</option>
                        <option value="price-desc">Price (High to Low)</option>
                        <option value="quantity-desc">Quantity (High to Low)</option>
                    </select>
                </div>
                <div class="item-count">
                    <span id="results-count">Showing 0 materials</span>
                    <span class="rx-badge-demo">DEMO DATA</span>
                </div>
            </div>
        </header>

        <div class="marketplace-container">
            <!-- Mobile Filter Toggle -->
            <input type="checkbox" id="filter-toggle">
            <label for="filter-toggle" class="filter-toggle-btn">Toggle Filters</label>

            <!-- Sidebar Filters -->
            <aside class="sidebar">
                <div class="filter-section">
                    <div class="rx-search-wrap">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        <input type="text" id="search-input" placeholder="Search materials...">
                    </div>
                </div>

                <div class="filter-section">
                    <h3 class="filter-title">Category</h3>
                    <div id="category-filters">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <div class="filter-section">
                    <h3 class="filter-title">Condition</h3>
                    <div id="condition-filters">
                        <label class="filter-option"><input type="checkbox" value="Processed/Sorted"> Processed/Sorted</label>
                        <label class="filter-option"><input type="checkbox" value="Cleaned"> Cleaned</label>
                        <label class="filter-option"><input type="checkbox" value="Sorted"> Sorted</label>
                        <label class="filter-option"><input type="checkbox" value="Raw/Unsorted"> Raw/Unsorted</label>
                    </div>
                </div>

                <div class="filter-section">
                    <h3 class="filter-title">Location</h3>
                    <input type="text" class="filter-input-text" id="location-input" placeholder="City, State...">
                </div>

                <div class="filter-section">
                    <h3 class="filter-title">Quantity Range (kg)</h3>
                    <div class="qty-range">
                        <input type="number" class="filter-input-number" id="qty-min" placeholder="Min">
                        <span>-</span>
                        <input type="number" class="filter-input-number" id="qty-max" placeholder="Max">
                    </div>
                </div>

                <div class="filter-section">
                    <h3 class="filter-title">Price Range (₹/kg)</h3>
                    <div class="qty-range">
                        <input type="number" class="filter-input-number" id="price-min" placeholder="Min ₹">
                        <span>-</span>
                        <input type="number" class="filter-input-number" id="price-max" placeholder="Max ₹">
                    </div>
                </div>

                <div class="filter-section">
                    <h3 class="filter-title">Availability</h3>
                    <div id="availability-filters">
                        <label class="filter-option"><input type="checkbox" value="0"> Immediate</label>
                        <label class="filter-option"><input type="checkbox" value="7"> Within 7 days</label>
                        <label class="filter-option"><input type="checkbox" value="14"> Within 14 days</label>
                        <label class="filter-option"><input type="checkbox" value="30"> Within 30 days</label>
                    </div>
                </div>

                <button class="btn-clear-filters" id="clear-filters-btn">Clear All Filters</button>
            </aside>

            <!-- Main Content -->
            <div class="main-content">
                <div class="category-pills" id="category-pills-container">
                    <!-- Populated by JS -->
                </div>

                <div class="active-filters" id="active-filters-container">
                    <!-- Populated by JS -->
                </div>

                <div class="materials-grid" id="materials-grid">
                    <!-- Populated by JS -->
                </div>
                
                <div class="no-results" id="no-results-state" style="display: none;">
                    <h3>No materials match your filters</h3>
                    <p>Try adjusting your search criteria or removing some filters.</p>
                    <button class="btn-clear-filters" style="width: auto; margin-top: 1rem; display: inline-block;" id="reset-no-results">Reset Filters</button>
                </div>
            </div>
        </div>
    </main>

    <div id="rx-footer-container"></div>

    <!-- Scripts -->
    <script src="js/data/materials.js"></script>
    <script src="js/data/matches.js"></script>
    <script src="js/data/journeys.js"></script>
    <script src="js/data/index.js"></script>
    <script src="js/nav.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Nav and Footer
            if(window.RX && window.RX.navHTML) {
                document.getElementById('rx-nav-container').innerHTML = window.RX.navHTML();
            }
            if(window.RX && window.RX.footerHTML) {
                document.getElementById('rx-footer-container').innerHTML = window.RX.footerHTML();
            }

            const data = window.RX_DATA || { materials: [], categories: [] };
            let materials = [...data.materials];
            let activeFilters = {
                search: '',
                categories: [],
                conditions: [],
                location: '',
                qtyMin: null,
                qtyMax: null,
                availability: [] // in days
            };

            // DOM Elements
            const grid = document.getElementById('materials-grid');
            const noResults = document.getElementById('no-results-state');
            const countDisplay = document.getElementById('results-count');
            const activeFiltersContainer = document.getElementById('active-filters-container');
            const categoryPillsContainer = document.getElementById('category-pills-container');
            const catFiltersContainer = document.getElementById('category-filters');

            // Form Inputs
            const searchInput = document.getElementById('search-input');
            const locationInput = document.getElementById('location-input');
            const qtyMinInput = document.getElementById('qty-min');
            const qtyMaxInput = document.getElementById('qty-max');
            const sortSelect = document.getElementById('sort-select');
            
            // Default categories if missing
            const cats = data.categories && data.categories.length > 0 ? data.categories : 
                ['Metals', 'Polymers', 'Industrial Plastics', 'Textile / Fibre', 'Glass', 'Construction Materials', 'Mineral Byproducts', 'Wood / Biomass', 'Electronic Materials', 'Packaging Materials', 'Other Industrial Resources'];

            // Render category filters & pills
            function initCategories() {
                // Determine active category from URL
                const urlParams = new URLSearchParams(window.location.search);
                const initCategory = (urlParams.get('category') || '').toLowerCase();

                cats.forEach(cat => {
                    const catName = typeof cat === 'object' ? cat.name : cat;
                    const catSlug = typeof cat === 'object' ? (cat.slug || cat.name.toLowerCase()) : cat.toLowerCase();

                    // Checkbox
                    const label = document.createElement('label');
                    label.className = 'filter-option';
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.value = catName;
                    cb.dataset.slug = catSlug;
                    if(initCategory === catSlug || initCategory === catName.toLowerCase()) {
                        cb.checked = true;
                        activeFilters.categories.push(catName);
                    }
                    cb.addEventListener('change', updateFilters);
                    label.appendChild(cb);
                    label.appendChild(document.createTextNode(' ' + catName));
                    catFiltersContainer.appendChild(label);

                    // Pill
                    const pill = document.createElement('div');
                    const isActive = initCategory === catSlug || initCategory === catName.toLowerCase();
                    pill.className = `category-pill ${isActive ? 'active' : ''}`;
                    pill.textContent = catName;
                    pill.dataset.category = catName;
                    pill.dataset.slug = catSlug;
                    pill.addEventListener('click', () => {
                        const relatedCb = document.querySelector(`#category-filters input[value="${catName}"]`);
                        if(relatedCb) {
                            relatedCb.checked = !relatedCb.checked;
                            updateFilters();
                        }
                    });
                    categoryPillsContainer.appendChild(pill);
                });
            }

            // Bind Event Listeners
            searchInput.addEventListener('input', updateFilters);
            locationInput.addEventListener('input', updateFilters);
            qtyMinInput.addEventListener('input', updateFilters);
            qtyMaxInput.addEventListener('input', updateFilters);
            sortSelect.addEventListener('change', renderGrid);
            
            document.querySelectorAll('#condition-filters input').forEach(cb => {
                cb.addEventListener('change', updateFilters);
            });
            document.querySelectorAll('#availability-filters input').forEach(cb => {
                cb.addEventListener('change', updateFilters);
            });
            
            document.getElementById('clear-filters-btn').addEventListener('click', resetAllFilters);
            document.getElementById('reset-no-results').addEventListener('click', resetAllFilters);

            function resetAllFilters() {
                searchInput.value = '';
                locationInput.value = '';
                qtyMinInput.value = '';
                qtyMaxInput.value = '';
                
                document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.checked = false;
                });
                
                if (window.history.replaceState) {
                    const url = new URL(window.location);
                    url.searchParams.delete('category');
                    window.history.replaceState({}, '', url);
                }
                updateFilters();
            }

            function updateFilters() {
                activeFilters.search = searchInput.value.toLowerCase();
                activeFilters.location = locationInput.value.toLowerCase();
                activeFilters.qtyMin = qtyMinInput.value ? parseFloat(qtyMinInput.value) : null;
                activeFilters.qtyMax = qtyMaxInput.value ? parseFloat(qtyMaxInput.value) : null;
                
                activeFilters.categories = Array.from(document.querySelectorAll('#category-filters input:checked')).map(cb => cb.value);
                activeFilters.conditions = Array.from(document.querySelectorAll('#condition-filters input:checked')).map(cb => cb.value);
                activeFilters.availability = Array.from(document.querySelectorAll('#availability-filters input:checked')).map(cb => parseInt(cb.value));

                // Update Category Pills UI
                document.querySelectorAll('.category-pill').forEach(pill => {
                    if(activeFilters.categories.includes(pill.dataset.category)) {
                        pill.classList.add('active');
                    } else {
                        pill.classList.remove('active');
                    }
                });

                applyFilters();
            }

            function applyFilters() {
                let filtered = data.materials.filter(m => {
                    const locStr = typeof m.location === 'object' ? `${m.location.city || ''} ${m.location.state || ''}` : String(m.location || '');
                    // Search
                    if(activeFilters.search) {
                        const searchStr = `${m.name} ${m.category} ${m.grade} ${locStr}`.toLowerCase();
                        if(!searchStr.includes(activeFilters.search)) return false;
                    }
                    // Categories
                    if(activeFilters.categories.length > 0 && !activeFilters.categories.includes(m.category)) return false;
                    
                    // Conditions
                    if(activeFilters.conditions.length > 0 && !activeFilters.conditions.includes(m.condition)) return false;
                    
                    // Location
                    if(activeFilters.location) {
                        if(!locStr.toLowerCase().includes(activeFilters.location)) return false;
                    }
                    
                    // Quantity
                    if(activeFilters.qtyMin !== null && m.quantity < activeFilters.qtyMin) return false;
                    if(activeFilters.qtyMax !== null && m.quantity > activeFilters.qtyMax) return false;
                    
                    // Availability - simplistic check for demo
                    if(activeFilters.availability.length > 0) {
                        // Assuming materials are immediately available unless specified
                    }

                    return true;
                });

                materials = filtered;
                renderActiveFilterTags();
                renderGrid();
            }

            function renderActiveFilterTags() {
                activeFiltersContainer.innerHTML = '';
                
                const createTag = (label, onRemove) => {
                    const tag = document.createElement('div');
                    tag.className = 'filter-tag';
                    tag.innerHTML = `${label} <span>&times;</span>`;
                    tag.querySelector('span').addEventListener('click', onRemove);
                    activeFiltersContainer.appendChild(tag);
                };

                if(activeFilters.search) {
                    createTag(`Search: ${activeFilters.search}`, () => {
                        searchInput.value = ''; updateFilters();
                    });
                }
                if(activeFilters.location) {
                    createTag(`Loc: ${activeFilters.location}`, () => {
                        locationInput.value = ''; updateFilters();
                    });
                }
                if(activeFilters.qtyMin !== null || activeFilters.qtyMax !== null) {
                    const min = activeFilters.qtyMin || 0;
                    const max = activeFilters.qtyMax || 'Any';
                    createTag(`Qty: ${min} - ${max}`, () => {
                        qtyMinInput.value = ''; qtyMaxInput.value = ''; updateFilters();
                    });
                }
                activeFilters.categories.forEach(cat => {
                    createTag(cat, () => {
                        document.querySelector(`#category-filters input[value="${cat}"]`).checked = false;
                        updateFilters();
                    });
                });
                activeFilters.conditions.forEach(cond => {
                    createTag(cond, () => {
                        document.querySelector(`#condition-filters input[value="${cond}"]`).checked = false;
                        updateFilters();
                    });
                });
            }

            function sortMaterials(arr) {
                const sortVal = sortSelect.value;
                const sorted = [...arr];
                switch(sortVal) {
                    case 'price-asc':
                        sorted.sort((a, b) => a.askingPrice - b.askingPrice);
                        break;
                    case 'price-desc':
                        sorted.sort((a, b) => b.askingPrice - a.askingPrice);
                        break;
                    case 'quantity-desc':
                        sorted.sort((a, b) => b.quantity - a.quantity);
                        break;
                    case 'match-count':
                        // If there was a match count property
                        break;
                    default:
                        break;
                }
                return sorted;
            }

            function renderGrid() {
                grid.innerHTML = '';
                const sortedMaterials = sortMaterials(materials);
                
                countDisplay.textContent = `Showing ${sortedMaterials.length} materials`;

                if(sortedMaterials.length === 0) {
                    grid.style.display = 'none';
                    noResults.style.display = 'block';
                    return;
                }
                
                grid.style.display = 'grid';
                noResults.style.display = 'none';

                sortedMaterials.forEach(m => {
                    const card = document.createElement('div');
                    card.className = 'rx-material-card';
                    
                    let bgClass = 'rx-cat-metals';
                    if(m.category && (m.category.includes('Plastic') || m.category.includes('Polymer'))) bgClass = 'rx-cat-polymers';
                    if(m.category && (m.category.includes('Fiber') || m.category.includes('Paper'))) bgClass = 'rx-cat-fibers';
                    
                    let bankedBadge = m.status === 'banked' ? `<span class="rx-badge-demo" style="background:#173A2B;color:#A88A52;border:1px solid #A88A52">MATERIAL BANK</span>` : '';

                    card.innerHTML = `
                        <div class="card-visual ${bgClass}">
                            <span class="mono">${m.id}</span>
                            <div class="card-badges">
                                <span class="rx-badge-demo">SAMPLE LISTING</span>
                                ${bankedBadge}
                            </div>
                        </div>
                        <div class="card-content">
                            <div class="card-category mono">${m.category}</div>
                            <h3 class="card-title">${m.name}</h3>
                            <div class="card-specs">
                                <div><strong>Quantity</strong> ${(m.quantity || 0).toLocaleString()} kg</div>
                                <div><strong>Grade</strong> ${m.grade || 'N/A'}</div>
                                <div><strong>Condition</strong> ${m.condition || 'N/A'}</div>
                                <div><strong>Location</strong> ${typeof m.location === 'object' ? (m.location.city + ', ' + m.location.state) : (m.location || 'N/A')}</div>
                            </div>
                            <div class="card-footer">
                                <div class="card-price">₹${m.askingPrice || 0}/kg</div>
                                <a href="material-detail.html?id=${m.id}" class="btn-view">View Details</a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }

            // Init
            initCategories();
            applyFilters();
        });
    </script>
</body>
</html>
