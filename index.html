<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResourceX — Industrial Circular Economy & Byproduct Exchange</title>
  <meta name="description" content="ResourceX connects industrial byproduct generators with certified buyers and processors based on landed net-value matching and chain-of-custody tracking.">
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Core Design System & Components -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/compat.css">

  <style>
    :root {
      --rx-nav-height: 76px;
      --rx-app-bg: #0D110F;
      --rx-card-bg: rgba(21, 26, 23, 0.78);
      --rx-card-border: rgba(201, 196, 184, 0.12);
      --rx-hover-border: rgba(196, 173, 122, 0.4);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--rx-app-bg);
      color: var(--rx-ivory-800, #F2EFE7);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Custom Sleek Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0B0E0D;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(196, 173, 122, 0.3);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(196, 173, 122, 0.6);
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      z-index: 0;
    }

    /* Action Buttons */
    .rx-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 0.88rem;
      padding: 0.7rem 1.35rem;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid transparent;
    }
    .rx-btn-primary {
      background: linear-gradient(135deg, #C4AD7A, #A88A52);
      color: #0F1210;
      box-shadow: 0 4px 16px rgba(168, 138, 82, 0.25);
    }
    .rx-btn-primary:hover {
      background: linear-gradient(135deg, #D4C090, #B49A62);
      box-shadow: 0 6px 22px rgba(168, 138, 82, 0.4);
      transform: translateY(-2px);
    }
    .rx-btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(201, 196, 184, 0.18);
      color: #F2EFE7;
    }
    .rx-btn-secondary:hover {
      background: rgba(45, 112, 80, 0.2);
      border-color: #2D7050;
      color: #FFFFFF;
      transform: translateY(-2px);
    }
    .rx-btn-sm {
      padding: 0.4rem 0.85rem;
      font-size: 0.78rem;
      border-radius: 6px;
    }

    /* Cards & Containers */
    .table-card {
      background: var(--rx-card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--rx-card-border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.5);
    }
    .table-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(201, 196, 184, 0.08);
    }
    .table-card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: #F2EFE7;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* Tabs Ribbon */
    .tabs-nav {
      display: flex;
      gap: 0.5rem;
      background: rgba(18, 23, 20, 0.85);
      padding: 0.4rem;
      border-radius: 12px;
      border: 1px solid rgba(201, 196, 184, 0.12);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: transparent;
      border: none;
      color: #A8A5A0;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.6rem 1.15rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .tab-btn:hover {
      color: #F2EFE7;
      background: rgba(255, 255, 255, 0.05);
    }
    .tab-btn.active {
      background: rgba(45, 112, 80, 0.35);
      color: #F2EFE7;
      border: 1px solid rgba(45, 112, 80, 0.5);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }
    .tab-badge {
      background: rgba(196, 173, 122, 0.2);
      color: #C4AD7A;
      border: 1px solid rgba(196, 173, 122, 0.4);
      font-size: 0.68rem;
      padding: 0.1rem 0.45rem;
      border-radius: 10px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Metric Stat Cards */
    .stat-card {
      background: var(--rx-card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--rx-card-border);
      border-radius: 14px;
      padding: 1.5rem;
      position: relative;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .stat-card:hover {
      border-color: var(--rx-hover-border);
      transform: translateY(-3px);
      box-shadow: 0 14px 30px -10px rgba(0, 0, 0, 0.6);
    }
    .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #A8A5A0;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .stat-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(201, 196, 184, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #C4AD7A;
    }
    .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: #F2EFE7;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .stat-trend {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      color: #C4AD7A;
    }

    /* Tables */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }
    .data-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.88rem;
    }
    .data-table th {
      text-align: left;
      padding: 0.85rem 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #A8A5A0;
      text-transform: uppercase;
      background: rgba(15, 18, 16, 0.6);
      border-bottom: 1px solid rgba(201, 196, 184, 0.12);
    }
    .data-table td {
      padding: 1rem;
      border-bottom: 1px solid rgba(201, 196, 184, 0.06);
      color: #E8E4DB;
      vertical-align: middle;
    }
    .data-table tbody tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    /* Badges & Indicators */
    .tech-id {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: #C4AD7A;
      background: rgba(196, 173, 122, 0.08);
      border: 1px solid rgba(196, 173, 122, 0.2);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      display: inline-block;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      font-weight: 500;
    }
    .status-pill.active {
      background: rgba(45, 112, 80, 0.2);
      border: 1px solid rgba(45, 112, 80, 0.5);
      color: #3A8D65;
    }
    .status-pill.banked {
      background: rgba(196, 173, 122, 0.15);
      border: 1px solid rgba(196, 173, 122, 0.4);
      color: #C4AD7A;
    }
    .status-pill.pending {
      background: rgba(244, 162, 97, 0.15);
      border: 1px solid rgba(244, 162, 97, 0.4);
      color: #F4A261;
    }
    .table-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(201, 196, 184, 0.2);
      color: #F2EFE7;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .table-action-btn:hover {
      background: rgba(196, 173, 122, 0.15);
      border-color: #C4AD7A;
      color: #C4AD7A;
    }
    .table-action-btn.primary {
      background: rgba(45, 112, 80, 0.25);
      border-color: #2D7050;
      color: #3A8D65;
    }
    .table-action-btn.primary:hover {
      background: #2D7050;
      color: #FFFFFF;
    }

    /* Google Sign In Button */
    .google-signin-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #FFFFFF;
      color: #1F1F1F;
      border: 1px solid #DADCE0;
      border-radius: 12px;
      padding: 0.9rem 1.5rem;
      font-family: 'Roboto', 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      transition: all 0.25s ease;
      outline: none;
    }
    .google-signin-btn:hover {
      background: #F8FAFC;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      transform: translateY(-2px);
    }
    .google-icon-svg {
      width: 22px;
      height: 22px;
    }
    .google-spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 3px solid #E2E8F0;
      border-top-color: #4285F4;
      border-radius: 50%;
      animation: spinGoogle 0.8s linear infinite;
    }
    .google-signin-btn.loading .google-spinner { display: inline-block; }
    .google-signin-btn.loading .google-icon-svg { display: none; }
    .google-signin-btn.success {
      background: #2D7050;
      color: #FFFFFF;
      border-color: #2D7050;
    }
    @keyframes spinGoogle {
      to { transform: rotate(360deg); }
    }

    /* Timeline */
    .activity-timeline {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
      padding-left: 1.25rem;
    }
    .activity-timeline::before {
      content: '';
      position: absolute;
      left: 5px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: rgba(201, 196, 184, 0.12);
    }
    .timeline-item { position: relative; }
    .timeline-dot {
      position: absolute;
      left: -1.25rem;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2D7050;
      border: 2px solid #0D110F;
    }
    .timeline-dot.gold { background: #C4AD7A; }
    .timeline-dot.blue { background: #1A73E8; }
    .timeline-text { font-size: 0.85rem; color: #E8E4DB; }
    .timeline-time { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: #7A7874; margin-top: 0.2rem; }

    /* Fade Transition for SPA views */
    #spa-app {
      animation: viewFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes viewFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Shared Top Navigation Mount -->
  <div id="rx-nav-container"></div>

  <!-- Dynamic SPA Application Viewport -->
  <main id="spa-app" style="flex: 1; padding-top: calc(var(--rx-nav-height, 76px) + 1.25rem);"></main>

  <!-- Shared Footer Mount -->
  <div id="rx-footer-container"></div>

  <!-- Shared Toast Mount -->
  <div class="rx-toast-container"></div>

  <!-- Data Stores -->
  <script src="js/data/materials.js"></script>
  <script src="js/data/matches.js"></script>
  <script src="js/data/journeys.js"></script>
  <script src="js/data/index.js"></script>

  <!-- Navigation Utilities -->
  <script src="js/nav.js"></script>

  <!-- SPA Router & View Renderer -->
  <script src="js/spa-router.js"></script>

</body>
</html>
